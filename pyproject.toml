[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "escape-pinn"
version = "0.1.0"
description = "Escape-equation solvers for multi-arrival wave propagation: a mesh marching reference and a physics-informed neural network (2D/3D)."
license = "MIT"
requires-python = ">=3.14"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[black]
line-length = 120
target-version = ["py314"]

[tool.isort]
profile = "black"
src_paths = ["src"]